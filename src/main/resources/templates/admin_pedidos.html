<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Logística - AgroConecta Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Sidebar Activo */
        .nav-link.active {
            background-color: #f0fdf4;
            color: #166534;
            border-right: 3px solid #16a34a;
        }

        /* --- DATATABLES STYLING --- */
        .dataTables_wrapper .dataTables_length select, 
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.4rem 1rem;
            color: #4a5568;
            outline: none;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
        }
        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        /* Botones de Exportación */
        .dt-buttons .dt-button {
            background: white !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 0.5rem !important;
            color: #4a5568 !important;
            font-weight: 600 !important;
            font-size: 0.875rem !important;
            padding: 0.5rem 1rem !important;
            margin-right: 0.5rem !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
            transition: all 0.2s !important;
        }
        .dt-buttons .dt-button:hover {
            background-color: #f0fdf4 !important;
            color: #16a34a !important;
            border-color: #16a34a !important;
            transform: translateY(-1px);
        }

        /* Tabla */
        table.dataTable thead th {
            background-color: #f8fafc;
            border-bottom: 2px solid #e2e8f0 !important;
            color: #475569;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem !important;
        }
        table.dataTable tbody td {
            padding: 1rem !important;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        table.dataTable.no-footer { border-bottom: none !important; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- SIDEBAR (Consistente) -->
    <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col z-20">
        <div class="h-20 flex items-center px-8 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <div class="bg-green-600 text-white p-1.5 rounded-lg shadow-lg shadow-green-600/20">
                    <i class="fas fa-leaf"></i>
                </div>
                <span class="text-xl font-extrabold text-gray-900 tracking-tight">Agro<span class="text-green-600">Conecta</span></span>
            </div>
        </div>

        <nav class="flex-1 py-6 space-y-1">
            <p class="px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Principal</p>
            
            <a th:href="@{/admin/dashboard}" class="nav-link flex items-center gap-3 px-6 py-3 text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-green-700 transition">
                <i class="fas fa-home w-5 text-center"></i> Dashboard
            </a>
            
            <a th:href="@{/admin/usuarios}" class="nav-link flex items-center gap-3 px-6 py-3 text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-green-700 transition">
                <i class="fas fa-users w-5 text-center"></i> Usuarios
            </a>
            
            <a href="#" class="nav-link active flex items-center gap-3 px-6 py-3 text-sm font-medium transition">
                <i class="fas fa-shipping-fast w-5 text-center"></i> Pedidos
            </a>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <div class="flex items-center gap-3 p-3 rounded-xl bg-gray-50">
                <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 font-bold">AD</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-gray-900 truncate">Admin</p>
                    <a href="/logout" class="text-xs text-red-500 hover:underline">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto bg-gray-50">
        
        <!-- Header Móvil -->
        <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 md:hidden sticky top-0 z-10">
            <span class="font-bold text-lg text-green-700">AgroConecta</span>
            <a th:href="@{/admin/dashboard}" class="text-gray-500"><i class="fas fa-arrow-left"></i></a>
        </header>

        <main class="p-6 md:p-10 w-full max-w-7xl mx-auto">
            
            <!-- Encabezado de Página -->
            <div class="flex flex-col sm:flex-row justify-between items-end mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-900">Logística de Pedidos</h1>
                    <p class="text-gray-500 mt-1">Gestiona y actualiza el estado de los envíos en tiempo real.</p>
                </div>
                
                <!-- Mini Métricas (Opcionales) -->
                <div class="flex gap-4">
                    <div class="bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
                        <span class="text-sm font-bold text-gray-700">Pendientes</span>
                    </div>
                    <div class="bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-green-500"></div>
                        <span class="text-sm font-bold text-gray-700">Entregados</span>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de la Tabla -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-6">
                    <table id="ordersTable" class="w-full display responsive nowrap" style="width:100%">
                        <thead>
                            <tr>
                                <th>Orden #</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="o : ${pedidos}">
                                
                                <!-- ORDEN ID -->
                                <td>
                                    <div class="flex items-center gap-2">
                                        <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded font-mono text-xs font-bold" 
                                              th:text="${'#' + o.numeroOrden}">#000</span>
                                    </div>
                                </td>

                                <!-- FECHA -->
                                <td class="text-gray-600 text-sm">
                                    <div class="flex items-center gap-2">
                                        <i class="far fa-calendar text-gray-400"></i>
                                        <span th:text="${#strings.replace(o.fechaCreacion.toString(), 'T', ' ').substring(0,16)}">Fecha</span>
                                    </div>
                                </td>

                                <!-- CLIENTE -->
                                <td>
                                    <div class="font-medium text-gray-900" th:text="${o.usuario.nombreCompleto}">Juan</div>
                                    <div class="text-xs text-gray-500" th:text="${o.usuario.email}">juan@mail.com</div>
                                </td>

                                <!-- TOTAL -->
                                <td>
                                    <span class="text-green-600 font-bold" th:text="'$' + ${o.total}">$100</span>
                                </td>

                                <!-- ESTADO (Badge Dinámico) -->
                                <td>
                                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border"
                                          th:classappend="${o.estado == 'Pendiente' ? 'bg-yellow-50 text-yellow-700 border-yellow-200' : 
                                                           (o.estado == 'En Camino' ? 'bg-blue-50 text-blue-700 border-blue-200' : 
                                                           (o.estado == 'Entregado' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'))}">
                                        <span class="w-1.5 h-1.5 rounded-full"
                                              th:classappend="${o.estado == 'Pendiente' ? 'bg-yellow-500' : 
                                                               (o.estado == 'En Camino' ? 'bg-blue-500' : 
                                                               (o.estado == 'Entregado' ? 'bg-green-500' : 'bg-red-500'))}"></span>
                                        <span th:text="${o.estado}">Estado</span>
                                    </span>
                                </td>

                                <!-- ACCIONES (Cambio de Estado) -->
                                <td>
                                    <form th:action="@{/admin/pedidos/cambiar-estado}" method="post" class="flex items-center gap-2">
                                        <input type="hidden" name="id" th:value="${o.id}" />
                                        
                                        <div class="relative">
                                            <select name="estado" onchange="this.form.submit()"
                                                    class="appearance-none bg-gray-50 border border-gray-300 text-gray-700 text-xs rounded-lg focus:ring-green-500 focus:border-green-500 block w-32 p-2 pr-8 cursor-pointer hover:bg-gray-100 transition">
                                                <option value="Pendiente" th:selected="${o.estado == 'Pendiente'}">⏳ Pendiente</option>
                                                <option value="En Camino" th:selected="${o.estado == 'En Camino'}">🚚 En Camino</option>
                                                <option value="Entregado" th:selected="${o.estado == 'Entregado'}">✅ Entregado</option>
                                                <option value="Cancelado" th:selected="${o.estado == 'Cancelado'}">❌ Cancelado</option>
                                            </select>
                                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                                                <i class="fas fa-chevron-down text-xs"></i>
                                            </div>
                                        </div>

                                        <button type="button" class="text-blue-500 hover:text-blue-700 p-2 rounded-full hover:bg-blue-50 transition" title="Ver Detalles (Próximamente)">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    
    <!-- Extensiones Botones -->
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#ordersTable').DataTable({
                responsive: true,
                dom: '<"flex flex-col sm:flex-row justify-between items-center mb-4 gap-4" B f>rt<"flex justify-between items-center mt-4" i p>',
                buttons: [
                    { extend: 'excelHtml5', text: '<i class="fas fa-file-excel mr-2 text-green-600"></i> Excel', className: 'dt-button' },
                    { extend: 'pdfHtml5', text: '<i class="fas fa-file-pdf mr-2 text-red-600"></i> PDF', className: 'dt-button' },
                    { extend: 'print', text: '<i class="fas fa-print mr-2 text-gray-600"></i> Imprimir', className: 'dt-button' }
                ],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json',
                    search: "_INPUT_",
                    searchPlaceholder: "Buscar pedido..."
                },
                pageLength: 10,
                order: [[ 1, "desc" ]] // Ordenar por fecha (columna 1) descendente
            });
        });
    </script>

</body>
</html>
