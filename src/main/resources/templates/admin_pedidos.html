<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Logística - AgroConecta Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Sidebar Activo */
        .nav-link.active {
            background-color: #f0fdf4;
            color: #166534;
            border-right: 3px solid #16a34a;
        }

        /* --- DATATABLES STYLING --- */
        .dataTables_wrapper .dataTables_length select, 
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.4rem 1rem;
            color: #4a5568;
            outline: none;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
        }
        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        /* Botones de Exportación */
        .dt-buttons .dt-button {
            background: white !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 0.5rem !important;
            color: #4a5568 !important;
            font-weight: 600 !important;
            font-size: 0.875rem !important;
            padding: 0.5rem 1rem !important;
            margin-right: 0.5rem !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
            transition: all 0.2s !important;
        }
        .dt-buttons .dt-button:hover {
            background-color: #f0fdf4 !important;
            color: #16a34a !important;
            border-color: #16a34a !important;
            transform: translateY(-1px);
        }

        /* Tabla */
        table.dataTable thead th {
            background-color: #f8fafc;
            border-bottom: 2px solid #e2e8f0 !important;
            color: #475569;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem !important;
        }
        table.dataTable tbody td {
            padding: 1rem !important;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        table.dataTable.no-footer { border-bottom: none !important; }
    </style>
</head>
<body class="bg-[#f8fafc] flex h-screen overflow-hidden text-gray-800 font-sans antialiased">

    <div th:replace="fragments/admin_sidebar :: sidebar('pedidos')"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto bg-gray-50">
        
        <!-- Header Móvil -->
        <header class="h-24 flex items-center justify-between px-10">
                <div class="flex items-center">
                    
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">AgroConecta Admin</p>
                        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Gestión de Pedidos</h1>
                    </div>
                </div>
            </header>

        <main class="p-6 md:p-10 w-full">
            
            <!-- Encabezado de Página -->
            <div class="flex flex-col sm:flex-row justify-between items-end mb-8 gap-4">
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Logística de Pedidos</h1>
                
                    <p class="text-gray-500 mt-1">Gestiona y actualiza el estado de los envíos en tiempo real.</p>
                </div>
                
                <!-- Mini Métricas (Opcionales) -->
                <div class="flex gap-4">
                    <div class="bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
                        <span class="text-sm font-bold text-gray-700">Pendientes</span>
                    </div>
                    <div class="bg-white px-4 py-2 rounded-lg border border-gray-200 shadow-sm flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-green-500"></div>
                        <span class="text-sm font-bold text-gray-700">Entregados</span>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de la Tabla -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-6">
                    <table id="ordersTable" class="w-full display responsive nowrap" style="width:100%">
                        <thead>
                            <tr>
                                <th>Orden #</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Tipo</th>
                                <th>Peso</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="o : ${pedidos}">
                                
                                <!-- ORDEN ID -->
                                <td>
                                    <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded font-mono text-xs font-bold" 
                                          th:text="${'#' + o.numeroOrden}">#000</span>
                                </td>

                                <!-- FECHA -->
                                <td class="text-gray-600 text-xs">
                                    <span th:text="${#strings.replace(o.fechaCreacion.toString(), 'T', ' ').substring(0,16)}">Fecha</span>
                                </td>

                                <!-- CLIENTE -->
                                <td>
                                    <div class="font-medium text-gray-900 text-xs" th:text="${o.usuario.nombreCompleto}">Juan</div>
                                    <div class="text-[10px] text-gray-400" th:text="${o.usuario.email}">juan@mail.com</div>
                                </td>

                                <!-- TOTAL -->
                                <td>
                                    <span class="text-green-600 font-bold text-xs" th:text="'$' + ${o.total}">$100</span>
                                </td>

                                <!-- TIPO ENVIO -->
                                <td>
                                    <span th:if="${o.tipoEnvio == 'RAPIDO'}" class="bg-blue-50 text-blue-600 text-[10px] font-bold px-2 py-0.5 rounded-full">⚡ RAPIDO</span>
                                    <span th:unless="${o.tipoEnvio == 'RAPIDO'}" class="bg-gray-50 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">🚛 ECONOMICO</span>
                                </td>

                                <!-- PESO -->
                                <td>
                                    <span class="text-xs text-gray-500" th:text="${o.pesoTotalKg != null ? o.pesoTotalKg + ' kg' : '-'}">-</span>
                                </td>

                                <!-- ESTADO (Badge Dinámico) -->
                                <td>
                                    <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold border"
                                          th:classappend="${estadoService.getBadgeClases(o.estado)}">
                                        <span class="w-1.5 h-1.5 rounded-full" th:classappend="${estadoService.getBadgeDotClase(o.estado)}"></span>
                                        <span th:text="${o.estado}">Estado</span>
                                    </span>
                                </td>

                                <!-- ACCIONES (Cambio de Estado) -->
                                <td>
                                    <form th:action="@{/admin/pedidos/cambiar-estado}" method="post" class="flex items-center gap-1">
                                        <input type="hidden" name="id" th:value="${o.id}" />
                                        <select name="estado" onchange="this.form.submit()"
                                                class="appearance-none bg-gray-50 border border-gray-300 text-gray-700 text-[10px] rounded-lg focus:ring-green-500 focus:border-green-500 block w-36 p-1.5 cursor-pointer hover:bg-gray-100 transition">
                                            <option th:each="est : ${todosLosEstados}" 
                                                    th:value="${est}" 
                                                    th:text="${est}"
                                                    th:selected="${o.estado == est}"></option>
                                        </select>
                                    </form>
                                </td>
                            </tr>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    
    <!-- Extensiones Botones -->
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#ordersTable').DataTable({
                responsive: true,
                dom: '<"flex flex-col sm:flex-row justify-between items-center mb-4 gap-4" B f>rt<"flex justify-between items-center mt-4" i p>',
                buttons: [
                    { extend: 'excelHtml5', text: '<i class="fas fa-file-excel mr-2 text-green-600"></i> Excel', className: 'dt-button' },
                    { extend: 'pdfHtml5', text: '<i class="fas fa-file-pdf mr-2 text-red-600"></i> PDF', className: 'dt-button' },
                    { extend: 'print', text: '<i class="fas fa-print mr-2 text-gray-600"></i> Imprimir', className: 'dt-button' }
                ],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json',
                    search: "_INPUT_",
                    searchPlaceholder: "Buscar pedido..."
                },
                pageLength: 10,
                order: [[ 1, "desc" ]] // Ordenar por fecha (columna 1) descendente
            });
        });
    </script>

</body>
</html>
