<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Crear Cuenta - AgroConecta</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; /* Evita scroll en el body */ }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="flex h-screen w-full overflow-hidden">

        <!-- SECCIÓN IZQUIERDA (40% ancho) -->
        <div class="hidden lg:flex w-5/12 relative bg-green-900 items-center justify-center overflow-hidden">
            <img src="https://images.unsplash.com/photo-1605000797499-95a51c5269ae?q=80&w=1471&auto=format&fit=crop" 
                 class="absolute inset-0 w-full h-full object-cover opacity-50 mix-blend-overlay" alt="Agricultura">
            
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-green-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>

            <div class="relative z-10 px-10 text-center">
                <div class="mb-6">
                    <span class="bg-white/20 text-white px-3 py-0.5 rounded-full text-[10px] font-bold tracking-widest uppercase border border-white/20 backdrop-blur-sm">Comunidad</span>
                </div>
                <h2 class="text-3xl font-extrabold text-white mb-4 leading-tight">Más que una tienda,<br>somos familia.</h2>
                <p class="text-green-100 text-sm mb-8 leading-relaxed">
                    Únete a la red de comercio justo más grande de Colombia.
                </p>

                <div class="grid grid-cols-2 gap-3">
                    <div class="glass-card p-3 rounded-xl text-center">
                        <p class="text-2xl font-bold text-white">2k+</p>
                        <p class="text-green-200 text-[10px] uppercase font-semibold">Campesinos</p>
                    </div>
                    <div class="glass-card p-3 rounded-xl text-center">
                        <p class="text-2xl font-bold text-white">15k+</p>
                        <p class="text-green-200 text-[10px] uppercase font-semibold">Compradores</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN DERECHA (60% ancho) - Formulario Compacto -->
        <div class="w-full lg:w-7/12 flex flex-col bg-white h-full justify-center px-8 sm:px-12 lg:px-16 py-4">
            
            <div class="w-full max-w-lg mx-auto">
                <!-- Header Móvil -->
                <div class="lg:hidden text-center mb-4">
                    <a href="/" class="text-xl font-extrabold text-green-700 flex items-center justify-center gap-2">
                        <i class="fas fa-leaf"></i> AgroConecta
                    </a>
                </div>

                <div class="mb-6 text-center lg:text-left">
                    <h1 class="text-2xl font-bold text-gray-900">Crea tu cuenta gratis 🚀</h1>
                    <p class="text-xs text-gray-500 mt-1">Completa tus datos y empieza a disfrutar.</p>
                </div>

                <!-- Mensajes de Error (Compactos) -->
                <div th:if="${param.error_email}" class="mb-4 p-2 rounded-lg bg-red-50 border border-red-100 flex items-center gap-2 text-xs text-red-700">
                    <i class="fas fa-exclamation-circle"></i> Correo ya registrado.
                </div>

                <form th:action="@{/registro/guardar}" th:object="${usuario}" method="post" class="space-y-3">
                    
                    <!-- ROLES (Diseño Horizontal Compacto) -->
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer relative">
                            <input type="radio" name="rol" value="CLIENTE" class="peer sr-only" checked />
                            <div class="p-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 peer-checked:border-green-500 peer-checked:bg-green-50/50 transition-all flex items-center justify-center gap-2 h-full">
                                <div class="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
                                    <i class="fas fa-shopping-basket text-sm"></i>
                                </div>
                                <div class="text-left">
                                    <span class="block text-sm font-bold text-gray-700 peer-checked:text-green-800">Comprador</span>
                                </div>
                                <div class="absolute top-2 right-2 text-green-600 opacity-0 peer-checked:opacity-100">
                                    <i class="fas fa-check-circle text-xs"></i>
                                </div>
                            </div>
                        </label>

                        <label class="cursor-pointer relative">
                            <input type="radio" name="rol" value="CAMPESINO" class="peer sr-only" />
                            <div class="p-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 peer-checked:border-green-500 peer-checked:bg-green-50/50 transition-all flex items-center justify-center gap-2 h-full">
                                <div class="w-8 h-8 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center">
                                    <i class="fas fa-tractor text-sm"></i>
                                </div>
                                <div class="text-left">
                                    <span class="block text-sm font-bold text-gray-700 peer-checked:text-green-800">Vendedor</span>
                                </div>
                                <div class="absolute top-2 right-2 text-green-600 opacity-0 peer-checked:opacity-100">
                                    <i class="fas fa-check-circle text-xs"></i>
                                </div>
                            </div>
                        </label>
                    </div>

                    <!-- Nombre Completo -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="far fa-id-card text-gray-400 text-sm"></i>
                        </div>
                        <input type="text" th:field="*{nombreCompleto}" required placeholder="Nombre Completo"
                               class="block w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-1 focus:ring-green-500 focus:border-green-500 bg-gray-50 focus:bg-white" />
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <!-- Usuario -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="far fa-user text-gray-400 text-sm"></i>
                            </div>
                            <input type="text" th:field="*{userName}" required placeholder="Usuario"
                                   class="block w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-1 focus:ring-green-500 focus:border-green-500 bg-gray-50 focus:bg-white" />
                        </div>

                        <!-- Teléfono -->
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-mobile-alt text-gray-400 text-sm ml-0.5"></i>
                            </div>
                            <input type="text" th:field="*{telefono}" 
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                   inputmode="numeric" maxlength="10" placeholder="Teléfono"
                                   class="block w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-1 focus:ring-green-500 focus:border-green-500 bg-gray-50 focus:bg-white" />
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="far fa-envelope text-gray-400 text-sm"></i>
                        </div>
                        <input type="email" th:field="*{email}" required placeholder="Correo Electrónico"
                               class="block w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-1 focus:ring-green-500 focus:border-green-500 bg-gray-50 focus:bg-white" />
                    </div>

                    <!-- Contraseña -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400 text-xs"></i>
                        </div>
                        <input type="password" th:field="*{password}" required placeholder="Contraseña" minlength="4"
                               class="block w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-1 focus:ring-green-500 focus:border-green-500 bg-gray-50 focus:bg-white" />
                    </div>

                    <!-- Botón y Links -->
                    <div class="pt-2">
                        <button type="submit" 
                                class="w-full py-3 px-4 border border-transparent rounded-lg shadow-md shadow-green-600/20 text-sm font-bold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all transform hover:-translate-y-0.5">
                            Crear mi cuenta
                        </button>

                        <div class="mt-4 flex justify-between items-center text-xs text-gray-500">
                            <a th:href="@{/}" class="hover:text-gray-800 flex items-center gap-1">
                                <i class="fas fa-arrow-left"></i> Inicio
                            </a>
                            <span>
                                ¿Ya tienes cuenta? 
                                <a th:href="@{/login}" class="font-bold text-green-600 hover:underline">Inicia sesión</a>
                            </span>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
