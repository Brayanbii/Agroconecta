<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Gestionar Usuario - AgroConecta Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Efecto Focus en Inputs */
        input:focus, select:focus {
            outline: none;
            border-color: #16a34a; /* green-600 */
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1);
        }
        
        /* Animación de entrada */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-gray-100 overflow-hidden fade-in-up">
        
        <!-- Header del Formulario -->
        <div class="bg-gray-900 px-8 py-6 flex justify-between items-center relative overflow-hidden">
            <!-- Decoración de fondo -->
            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-green-600 rounded-full opacity-20 blur-3xl"></div>
            
            <div class="relative z-10">
                <h2 class="text-2xl font-extrabold text-white flex items-center gap-3">
                    <div class="bg-green-600 p-2 rounded-lg shadow-lg">
                        <i class="fas fa-user-plus text-sm"></i>
                    </div>
                    <span th:text="${usuario.id} ? 'Editar Usuario' : 'Nuevo Usuario'">Usuario</span>
                </h2>
                <p class="text-gray-400 text-sm mt-1 ml-11">Ingresa los datos para registrar un nuevo miembro.</p>
            </div>

            <a th:href="@{/admin/usuarios}" class="text-gray-400 hover:text-white hover:bg-gray-800 p-2 rounded-full transition" title="Cerrar">
                <i class="fas fa-times text-xl"></i>
            </a>
        </div>

        <!-- Formulario -->
        <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post" class="p-8 space-y-6">
            
            <input type="hidden" th:field="*{id}" />

            <!-- Errores de Validación del Servidor -->
            <div th:if="${#fields.hasErrors('*')}" class="p-4 rounded-xl bg-red-50 border border-red-200 text-sm text-red-700">
                <div class="flex items-center gap-2 font-bold mb-2">
                    <i class="fas fa-exclamation-triangle"></i> Por favor corrige los siguientes errores:
                </div>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                </ul>
            </div>
            
            <!-- Nombre Completo (Full Width) -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Nombre Completo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                        <i class="far fa-id-card"></i>
                    </div>
                    <input type="text" th:field="*{nombreCompleto}" required placeholder="Ej: Juan Pérez"
                           class="block w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 bg-gray-50 focus:bg-white transition" />
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Nombre de Usuario -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="far fa-user"></i>
                        </div>
                        <input type="text" th:field="*{userName}" required placeholder="juan123"
                               class="block w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 bg-gray-50 focus:bg-white transition" />
                    </div>
                </div>

                <!-- Contraseña -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" th:field="*{password}" placeholder="••••••••"
                               class="block w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 bg-gray-50 focus:bg-white transition" />
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1 ml-1" th:if="${usuario.id}">Dejar en blanco para mantener la actual.</p>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Correo Electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="far fa-envelope"></i>
                        </div>
                        <input type="email" th:field="*{email}" required placeholder="juan@mail.com"
                               class="block w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 bg-gray-50 focus:bg-white transition" />
                    </div>
                </div>

                <!-- Teléfono -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Teléfono</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-mobile-alt"></i>
                        </div>
                        <input type="text" th:field="*{telefono}" 
                               oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                               inputmode="numeric" maxlength="10" placeholder="300..."
                               class="block w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 bg-gray-50 focus:bg-white transition" />
                    </div>
                </div>

                <!-- Rol (Selector Full Width en Desktop si quieres, o 2 col) -->
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Asignar Rol</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <select th:field="*{rol}" class="block w-full pl-11 pr-10 py-3 border border-gray-200 rounded-xl text-gray-900 bg-white focus:bg-white transition appearance-none cursor-pointer">
                            <option value="ADMIN">Administrador (Control Total)</option>
                            <option value="SOPORTE">Soporte (Agente de Servicio)</option>
                            <option value="CAMPESINO">Campesino (Vendedor)</option>
                            <option value="CLIENTE">Cliente (Comprador)</option>
                        </select>
                        <!-- Flecha custom -->
                        <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Botones de Acción -->
            <div class="flex items-center justify-end gap-4 pt-6 border-t border-gray-100 mt-8">
                <a th:href="@{/admin/usuarios}" class="px-6 py-3 rounded-xl text-gray-500 font-bold hover:bg-gray-100 hover:text-gray-700 transition">
                    Cancelar
                </a>
                <button type="submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition transform hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fas fa-save"></i>
                    <span>Guardar Usuario</span>
                </button>
            </div>

        </form>
    </div>

</body>
</html>
