<div th:fragment="card(p, favoritosIds)"
     th:data-id="${p.id}" 
     th:data-precio="${p.precio}" 
     th:data-cat="${p.categoria}" 
     th:data-nombre="${#strings.toLowerCase(p.nombre)}"
     th:data-desc="${p.descripcion}"
     th:data-stock="${p.stock}"
     th:data-calificacion="${p.promedioCalificacion}"
     th:data-distanciac="${p.distanciaKm != null ? p.distanciaKm : 9999}"
     th:data-lat="${p.latitudOrigen != null ? p.latitudOrigen : ''}"
     th:data-lon="${p.longitudOrigen != null ? p.longitudOrigen : ''}"
     class="min-w-[280px] max-w-[280px] shrink-0 product-card js-product-card bg-white rounded-3xl shadow-bento border border-gray-100 overflow-hidden flex flex-col h-[400px] group relative transition-all duration-300">
    
    <!-- Badge Flotante -->
    <span class="absolute top-3 left-3 bg-white/90 backdrop-blur text-green-700 text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wide z-10 shadow-sm"
          th:text="${p.categoria}">CAT</span>

    <!-- Imagen -->
    <a th:href="@{/tienda/producto/{id}(id=${p.id})}" class="relative h-48 overflow-hidden bg-gray-100 block rounded-t-3xl transform-gpu shrink-0">
        <img th:src="${p.imagenUrl.startsWith('http') ? p.imagenUrl : '/images/' + p.imagenUrl}" 
             class="w-full h-full object-cover mix-blend-multiply group-hover:scale-110 transition duration-700 ease-out" 
             alt="Producto"
             onerror="this.onerror=null; this.src=window.fallbackImg">
        
        <!-- Overlay Oscuro al Hover -->
        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-all duration-300"></div>
        
        <!-- Botón Favorito -->
        <button type="button" th:onclick="'toggleFavorito(event, this, ' + ${p.id} + ')'" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 backdrop-blur-sm flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-white transition-all shadow-sm z-10" title="Añadir a favoritos">
            <i th:class="${favoritosIds != null and #lists.contains(favoritosIds, p.id)} ? 'fas fa-heart text-red-500 scale-110' : 'far fa-heart'"></i>
        </button>
    </a>

    <!-- Cuerpo de la Tarjeta -->
    <div class="p-5 flex-1 flex flex-col relative overflow-hidden">
        
        <!-- Vendedor (Avatar y Verificado) -->
        <div class="flex items-center gap-2 mb-2">
            <div class="w-6 h-6 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-xs shadow-inner shrink-0">
                <i class="fas fa-tractor"></i>
            </div>
            <div class="flex items-center gap-1 min-w-0">
                <span class="text-xs text-gray-500 font-bold truncate max-w-[100px]" th:text="${p.usuario != null ? p.usuario.nombreCompleto : 'AgroConecta'}">Vendedor</span>
                <i class="fas fa-check-circle text-blue-500 text-[11px] shrink-0" title="Productor Verificado"></i>
            </div>
        </div>

        <a th:href="@{/tienda/producto/{id}(id=${p.id})}">
            <h3 class="text-lg font-bold text-gray-900 leading-tight mb-1 group-hover:text-green-700 transition-colors line-clamp-2" th:text="${p.nombre}">Nombre</h3>
        </a>
        
        <!-- Ubicación y Distancia -->
        <div class="flex items-center gap-1 mb-2 mt-1" th:if="${p.municipioOrigen != null}">
            <i class="fas fa-map-marker-alt text-red-500 text-[10px] shrink-0"></i>
            <span class="text-[10px] uppercase font-extrabold text-gray-400 tracking-wider truncate max-w-[110px]" th:text="${p.municipioOrigen}">Lugar</span>
            
            <span th:if="${p.distanciaKm != null and p.distanciaKm < 9999}" 
                  class="ml-auto bg-blue-50 border border-blue-100 text-blue-600 text-[9px] font-extrabold px-2 py-0.5 rounded-full shadow-sm shrink-0">
                  A <span th:text="${p.distanciaKm}"></span> km
            </span>
        </div>

        <!-- Estrellas y Stock -->
        <div class="flex items-center gap-1 mb-4 mt-1">
            <i class="fas fa-star text-amber-400 text-[10px]"></i>
            <span class="text-xs font-extrabold text-gray-700" th:text="${p.promedioCalificacion > 0 ? p.promedioCalificacion : 'Nuevo'}">Nuevo</span>
            <span class="text-[10px] text-gray-400 font-medium ml-1" th:if="${p.totalResenas > 0}" th:text="'(' + ${p.totalResenas} + ')'">(0)</span>
            <span class="ml-auto text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0" th:classappend="${p.stock > 0 ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}" th:text="${p.stock > 0 ? 'Disp: ' + p.stock + ' ' + p.getUnidadFormateada(p.stock) : 'Agotado'}">Disp: 0</span>
        </div>
        
        <div class="mt-auto flex items-end justify-between pt-2">
            <div>
                <p class="text-[10px] text-gray-400 font-semibold uppercase tracking-widest mb-0.5">Precio</p>
                <div class="flex items-baseline gap-1">
                    <span class="text-xl font-extrabold text-gray-900" th:text="'$' + ${p.precio}">$0</span>
                    <span class="text-[10px] text-gray-500 font-medium" th:text="'/ ' + ${p.unidad}">x un</span>
                </div>
            </div>
            
            <div class="flex gap-2 shrink-0">
                <!-- Botón Añadir -->
                <button type="button" th:data-id="${p.id}" th:data-nombre="${p.nombre}" th:data-stock="${p.stock}" onclick="añadirCarrito(event, this)" class="bg-green-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-green-600/30 hover:bg-green-700 hover:scale-105 transition-all active:scale-95" title="Añadir al carrito">
                    <i class="fas fa-plus text-sm"></i>
                </button>
            </div>
        </div>
    </div>
</div>
