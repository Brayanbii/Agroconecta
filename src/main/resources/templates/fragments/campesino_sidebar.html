<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activeTab)" class="w-[280px] bg-white border-r border-gray-100 flex-shrink-0 hidden md:flex flex-col z-20 shadow-xl shadow-gray-200/30">
    <div class="h-24 flex items-center px-8 border-b border-gray-50">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-green-500 to-green-700 text-white w-10 h-10 rounded-xl shadow-lg shadow-green-600/40 flex items-center justify-center"><i class="fas fa-leaf text-xl"></i></div>
            <span class="text-2xl font-extrabold text-gray-800 tracking-tight">Agro<span class="text-green-600">Conecta</span></span>
        </div>
    </div>
    
    <style>
        .sidebar-nav::-webkit-scrollbar { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .sidebar-nav::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .sidebar-nav { scrollbar-width: thin; scrollbar-color: #e2e8f0 transparent; }
    </style>

    <nav class="sidebar-nav flex-1 py-6 space-y-2 px-6 overflow-y-auto">
        <p class="px-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Panel del Productor</p>
        
        <a th:href="@{/campesino/productos}" 
           th:classappend="${activeTab == 'productos'} ? 'bg-green-50 text-green-700 shadow-sm ring-1 ring-green-100' : 'text-gray-600 hover:bg-gray-50 hover:text-green-600'" 
           class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group">
            <div th:classappend="${activeTab == 'productos'} ? 'bg-green-200/50 text-green-600' : 'bg-gray-100 group-hover:bg-green-100 text-gray-500 group-hover:text-green-600'" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300">
                <i class="fas fa-box-open"></i> 
            </div>
            Mis Productos
        </a>

        <a th:href="@{/campesino/productos/inventario}" 
           th:classappend="${activeTab == 'inventario'} ? 'bg-blue-50 text-blue-700 shadow-sm ring-1 ring-blue-100' : 'text-gray-600 hover:bg-gray-50 hover:text-green-600'" 
           class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group">
            <div th:classappend="${activeTab == 'inventario'} ? 'bg-blue-200/50 text-blue-600' : 'bg-gray-100 group-hover:bg-green-100 text-gray-500 group-hover:text-green-600'" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300">
                <i class="fas fa-cubes"></i> 
            </div>
            Control de Inventario
        </a>

        <a th:href="@{/campesino/productos/pedidos}" 
           th:classappend="${activeTab == 'pedidos'} ? 'bg-orange-50 text-orange-700 shadow-sm ring-1 ring-orange-100' : 'text-gray-600 hover:bg-gray-50 hover:text-green-600'" 
           class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group">
            <div th:classappend="${activeTab == 'pedidos'} ? 'bg-orange-200/50 text-orange-600' : 'bg-gray-100 group-hover:bg-green-100 text-gray-500 group-hover:text-green-600'" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300">
                <i class="fas fa-shopping-bag"></i> 
            </div>
            Gestión de Pedidos
        </a>

        <a th:href="@{/campesino/productos/informe}" 
           th:classappend="${activeTab == 'informe'} ? 'bg-teal-50 text-teal-700 shadow-sm ring-1 ring-teal-100' : 'text-gray-600 hover:bg-gray-50 hover:text-green-600'" 
           class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group">
            <div th:classappend="${activeTab == 'informe'} ? 'bg-teal-200/50 text-teal-600' : 'bg-gray-100 group-hover:bg-green-100 text-gray-500 group-hover:text-green-600'" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300">
                <i class="fas fa-chart-line"></i> 
            </div>
            Analíticas y Reportes
        </a>
        
        <a th:href="@{/campesino/productos/reputacion}" 
           th:classappend="${activeTab == 'reputacion'} ? 'bg-yellow-50 text-yellow-700 shadow-sm ring-1 ring-yellow-100' : 'text-gray-600 hover:bg-gray-50 hover:text-green-600'" 
           class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group">
            <div th:classappend="${activeTab == 'reputacion'} ? 'bg-yellow-200/50 text-yellow-600' : 'bg-gray-100 group-hover:bg-green-100 text-gray-500 group-hover:text-green-600'" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300">
                <i class="fas fa-star"></i> 
            </div>
            Reseñas y Reputación
        </a>
        
        <a th:href="@{/campesino/productos/finanzas}" 
           th:classappend="${activeTab == 'finanzas'} ? 'bg-emerald-50 text-emerald-700 shadow-sm ring-1 ring-emerald-100' : 'text-gray-600 hover:bg-gray-50 hover:text-emerald-600'" 
           class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group">
            <div th:classappend="${activeTab == 'finanzas'} ? 'bg-emerald-200/50 text-emerald-600' : 'bg-gray-100 group-hover:bg-emerald-100 text-gray-500 group-hover:text-emerald-600'" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300">
                <i class="fas fa-wallet"></i> 
            </div>
            AgroWallet
        </a>
        
        <a th:href="@{/campesino/productos/perfil}" 
           th:classappend="${activeTab == 'perfil'} ? 'bg-purple-50 text-purple-700 shadow-sm ring-1 ring-purple-100' : 'text-gray-600 hover:bg-gray-50 hover:text-purple-600'" 
           class="flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group">
            <div th:classappend="${activeTab == 'perfil'} ? 'bg-purple-200/50 text-purple-600' : 'bg-gray-100 group-hover:bg-purple-100 text-gray-500 group-hover:text-purple-600'" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300">
                <i class="fas fa-id-badge"></i> 
            </div>
            Ver tu Perfil
        </a>
        
        <a th:href="@{/tienda}" class="text-gray-600 hover:bg-gray-50 hover:text-green-600 flex items-center gap-4 px-4 py-3 text-sm font-bold rounded-xl transition-all duration-300 group mt-6 border-t border-gray-100 pt-6">
            <div class="bg-gray-100 w-8 h-8 rounded-lg flex items-center justify-center group-hover:bg-green-100 transition-all duration-300">
                <i class="fas fa-store group-hover:text-green-600"></i> 
            </div>
            Ver Tienda Pública
        </a>
    </nav>
    
    <div class="p-6 border-t border-gray-50">
        <div class="flex items-center justify-between p-4 rounded-2xl bg-gray-50 border border-gray-100 shadow-inner">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-sm font-extrabold shadow-sm shrink-0">
                    <span th:text="${usuario != null && usuario.nombreCompleto != null ? usuario.nombreCompleto.substring(0,1).toUpperCase() : (#authentication.name != null ? #authentication.name.substring(0,1).toUpperCase() : 'U')}">U</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-gray-800 truncate" th:text="${usuario != null && usuario.nombreCompleto != null ? #strings.arraySplit(usuario.nombreCompleto, ' ')[0] : #authentication.name}">Campesino</p>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Productor</p>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0 shrink-0">
                <button type="submit" class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-400 hover:text-red-500 hover:border-red-200 hover:bg-red-50 transition flex items-center justify-center shadow-sm"><i class="fas fa-sign-out-alt"></i></button>
            </form>
        </div>
    </div>
</aside>
</body>
</html>
