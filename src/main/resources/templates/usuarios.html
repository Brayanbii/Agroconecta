<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Gestión de Usuarios - AgroConecta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-green-50 min-h-screen p-8">

    <div class="bg-white w-full max-w-4xl mx-auto p-10 rounded-xl shadow-xl">
        
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">Gestión de Usuarios</h2>
            <a th:href="@{/usuarios/nuevo}" 
               class="py-2 px-5 font-medium text-white bg-green-600 rounded-lg shadow-md hover:bg-green-700 transition duration-150">
               + Nuevo Usuario
            </a>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
            <table class="w-full min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Usuario</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Rol</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Acciones</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="u: ${usuarios}" class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${u.id}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" th:text="${u.userName}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span th:text="${u.rol}"
                                  th:classappend="${u.rol == 'ADMIN'} ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'"
                                  class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full">
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-4">
                            <a th:href="@{'/usuarios/editar/' + ${u.id}}" class="text-green-600 hover:text-green-800 transition duration-150">Editar</a>
                            <a th:href="@{'/usuarios/eliminar/' + ${u.id}}" class="text-red-600 hover:text-red-800 transition duration-150">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <form th:action="@{/logout}" method="post" class="mt-10 text-center">
            <button type="submit" 
                    class="py-3 px-6 text-lg font-medium text-gray-700 bg-gray-200 rounded-lg shadow-sm hover:bg-gray-300 transition duration-150">
                Cerrar sesión
            </button>
        </form>
    </div>

</body>
</html>
