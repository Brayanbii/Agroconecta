<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Inicio Clientes - AgroConecta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg p-10 rounded-xl shadow-xl text-center">
        <div class="flex justify-center mb-4">
            <svg class="w-16 h-16 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>

        <h2 class="text-3xl font-bold text-gray-800 mb-2">Panel de Clientes</h2>
        <h3 class="text-xl text-green-700 font-semibold mb-6">AgroConecta</h3>

        <p class="text-lg text-gray-600 mb-6">
            Hola, tu rol actual es: <span th:text="${rol}" class="font-bold text-green-800 bg-green-200 px-2 py-1 rounded"></span>
        </p>

        <div class="space-y-4">
            <a th:href="@{/perfil}" class="block w-full py-3 px-5 text-lg font-medium text-white bg-green-600 rounded-lg shadow-md hover:bg-green-700 transition duration-150">
                Editar mi Perfil
            </a>

            <form th:action="@{/logout}" method="post" class="pt-4">
                <button type="submit" class="w-full py-3 px-5 text-lg font-medium text-gray-700 bg-gray-200 rounded-lg shadow-sm hover:bg-gray-300 transition duration-150">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </div>

</body>
</html>
