<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Inicio - AgroConecta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg p-10 rounded-xl shadow-xl text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">¡Bienvenido al sistema!</h2>
        
        <p class="text-lg text-gray-600 mb-6">
            Tu rol es: <span th:text="${rol}" class="font-semibold text-green-700 bg-green-100 px-2 py-1 rounded-full"></span>
        </p>
        
        <nav class="space-y-4">
            <!-- Menú del ADMIN -->
            <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/usuarios}" 
                   class="block w-full py-3 px-5 text-lg font-medium text-white bg-green-600 rounded-lg shadow-md hover:bg-green-700 transition duration-150">
                   Gestionar Usuarios
                </a>
            </div>
            
            <!-- Menú del USER -->
            <div th:if="${#authorization.expression('hasRole(''USER'')')}">
                <a th:href="@{/perfil}"
                   class="block w-full py-3 px-5 text-lg font-medium text-white bg-green-600 rounded-lg shadow-md hover:bg-green-700 transition duration-150">
                   Editar mi perfil
                </a>
            </div>
            
            <!-- Mensaje de éxito al actualizar perfil -->
            <div id="mensajeExito" th:if="${param.actualizado}" class="p-4 bg-green-100 text-green-700 rounded-lg">
                ¡Tu perfil ha sido actualizado correctamente!
            </div>
            
            <!-- Botón de Salir -->
            <form th:action="@{/logout}" method="post" class="pt-6">
                <button type="submit" 
                        class="w-full py-3 px-5 text-lg font-medium text-gray-700 bg-gray-200 rounded-lg shadow-sm hover:bg-gray-300 transition duration-150">
                    Cerrar sesión
                </button>
            </form>
        </nav>
    </div>

    <!-- JavaScript (El mismo que tenías) -->
    <script>
        setTimeout(function () {
            const mensaje = document.getElementById("mensajeExito");
            if (mensaje) {
                mensaje.style.display = "none";
            }
        }, 4000); // 4 segundos
    </script>
</body>
</html>
