spring.application.name=AccesoUsuarios

# ──────────────────────────────────────────────
# Base de datos MySQL (Aiven / Local)
# En Render: setear SPRING_DATASOURCE_URL con la URL completa incluyendo SSL
# ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_AccesoUsuarios}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ──────────────────────────────────────────────
# Puerto (Render asigna PORT automáticamente)
# ──────────────────────────────────────────────
server.port=${PORT:8080}

server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB
spring.thymeleaf.cache=false

# ──────────────────────────────────────────────
# MongoDB Atlas (imágenes vía GridFS)
# Render: setear MONGODB_URI con la connection string de Atlas
# ──────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/agroconecta_imagenes}
spring.data.mongodb.auto-index-creation=true

# ──────────────────────────────────────────────
# Configuración de logs para producción
# ──────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.proyecto.AccesoUsuarios=INFO